# Whisper API Proxy as a template for the ei23 DIY Smart Home
# https://github.com/ei23com/diy-smart-home
#
# This file is a snippet (not a complete compose project). Add the block under
# `services:` in ~/ei23-docker/docker-compose.yml, i.e. indented directly after
# the `services:` line.
#
# The paths are relative to ~/ei23-docker. On first start the container creates
# ./volumes/whisper-proxy/config/config.py itself (from config.example.py).
# After that, adjust API keys/clients and run `ei23 dc` or
# `docker compose up -d`.

  whisper-proxy:
    image: ghcr.io/ei23fxg/whisperapiproxy
    container_name: whisper-api-proxy
    restart: unless-stopped
    ports:
      - "5431:5431"
    environment:
      NEEDLE_TELEMETRY: "0"
      TZ: Europe/Berlin
      # Directory mount: the container writes config.py itself on first start.
      # Docker creates a directory for a file mount whose source is missing,
      # which would break the container start.
      CONFIG_PATH: /app/config/config.py
    volumes:
      - ./volumes/whisper-proxy/config:/app/config
      - ./volumes/whisper-proxy/recordings:/app/recordings
      - ./volumes/whisper-proxy/client_logs:/app/client_logs
      - ./volumes/whisper-proxy/proxy_logs:/app/logs
      - ./volumes/whisper-proxy/models/hf:/root/.cache/huggingface
      - ./volumes/whisper-proxy/models/cactus:/root/.cache/cactus-needle
